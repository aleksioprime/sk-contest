# UAT в Coolify (Docker Compose из образов GHCR).
# Домены задаются в интерфейсе Coolify для каждого сервиса:
#   frontend → https://contest.uat.skolhub.ru
#   backend  → https://contest.uat.skolhub.ru/api
#   sites    → https://sites.contest.uat.skolhub.ru и https://*.sites.contest.uat.skolhub.ru (wildcard — после настройки DNS-01)
# Переменные (секреты) задаются в Coolify: SECRET_KEY, DB__PASSWORD, SMTP__USER, SMTP__PASSWORD, SKOLSTREAM__*, CAPTCHA__*.
# Домены и сертификаты: docs/domains.md

x-backend: &backend
  image: ghcr.io/aleksioprime/sk-contest-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: &backend-env
    ENVIRONMENT: uat
    SECRET_KEY: ${SECRET_KEY}
    APP_URL: https://contest.uat.skolhub.ru
    SITES_BASE_DOMAIN: sites.contest.uat.skolhub.ru
    CORS_ORIGINS: '["https://contest.uat.skolhub.ru"]'
    DB__HOST: postgres
    DB__USER: sk_events
    DB__PASSWORD: ${DB__PASSWORD}
    DB__NAME: sk_events
    REDIS__HOST: redis
    STORAGE_DIR: /data/files
    SMTP__HOST: smtp.yandex.ru
    SMTP__PORT: 465
    SMTP__USE_SSL: 'true'
    SMTP__USER: ${SMTP__USER}
    SMTP__PASSWORD: ${SMTP__PASSWORD}
    SMTP__SENDER: ${SMTP__SENDER:-SK Contest <skolstream@yandex.ru>}
    CAPTCHA__CLIENT_KEY: ${CAPTCHA__CLIENT_KEY:-}
    CAPTCHA__SERVER_KEY: ${CAPTCHA__SERVER_KEY:-}
    # Свои домены лендингов (docs/domains.md)
    SITES_CNAME_TARGET: sites.contest.uat.skolhub.ru
    SITES_UPSTREAM_URL: ${SITES_UPSTREAM_URL:-http://sites:3000}
    TRAEFIK_DYNAMIC_DIR: /traefik-dynamic
  volumes:
    - files_data:/data/files
    - /data/coolify/proxy/dynamic:/traefik-dynamic
  depends_on: [postgres, redis]

services:
  backend:
    <<: *backend
    command: api
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s

  worker:
    <<: *backend
    command: worker

  frontend:
    image: ghcr.io/aleksioprime/sk-contest-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  sites:
    image: ghcr.io/aleksioprime/sk-contest-sites:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL_URL: http://backend:8000
      NUXT_PUBLIC_SITES_BASE_DOMAIN: sites.contest.uat.skolhub.ru
      NUXT_PUBLIC_APP_URL: https://contest.uat.skolhub.ru

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sk_events
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: sk_events
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
  files_data:
