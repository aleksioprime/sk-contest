server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API приходит через Traefik на тот же домен, сюда попадает только статика SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
