name: Образы

run-name: "Сборка образов SK Events ${{ github.sha }}"

# Образы для прода в Coolify (infra/coolify/docker-compose.prod.yaml). Старое приложение берёт свои образы
# sk-contest-*, на него сборка не влияет.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: sites
            context: .
            dockerfile: sites/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sk-events-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sk-events-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
